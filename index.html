<script>
(function() {
  // --- Auto-skip splash screen ---
  var skip = setInterval(function() {
    var beginBtn = document.querySelector('.splash-ready') ||
      Array.from(document.querySelectorAll('div')).find(function(d){ return d.textContent.trim() === 'begin'; });
    if (beginBtn) {
      clearInterval(skip);
      beginBtn.click();
    }
  }, 200);
  setTimeout(function(){ clearInterval(skip); }, 15000); // give up after 15s

  // --- Hide donate button/link (matches short "donate" text nodes only) ---
  var hideDonate = setInterval(function() {
    var found = false;
    document.querySelectorAll('div, a, button').forEach(function(el) {
      if (el.children.length === 0) {
        var txt = (el.textContent || '').trim().toLowerCase();
        if (txt === 'donate' || txt === 'donations keep the game running!') {
          el.style.display = 'none';
          found = true;
        }
      }
    });
    if (found) clearInterval(hideDonate);
  }, 300);
  setTimeout(function(){ clearInterval(hideDonate); }, 15000);

  // --- Hide coffee/heart donate icon in menu-bar-right ---
  var hideCoffee = setInterval(function() {
    var right = document.getElementById('menu-bar-right');
    if (!right) return;
    var found = false;
    right.querySelectorAll('.menu-item, [title]').forEach(function(el) {
      var title = (el.getAttribute('title') || '').toLowerCase();
      var svg = el.querySelector('svg');
      var svgHtml = svg ? svg.innerHTML.toLowerCase() : '';
      if (title.indexOf('donat') !== -1 || title.indexOf('coffee') !== -1 || title.indexOf('support') !== -1 ||
          svgHtml.indexOf('heart') !== -1) {
        el.style.display = 'none';
        found = true;
      }
    });
    if (found) clearInterval(hideCoffee);
  }, 300);
  setTimeout(function(){ clearInterval(hideCoffee); }, 15000);

  // Wait for game UI to mount
  var t = setInterval(function() {
    var bar = document.getElementById('menu-bar-left');
    if (!bar) return;
    clearInterval(t);

    // --- Bucket icon button (matches .menu-item style) ---
    var btn = document.createElement('div');
    btn.id = 'color-picker-btn';
    btn.className = 'menu-item';
    btn.title = 'Car colour';
    btn.innerHTML = '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M4 8h16" stroke-width="2"/></svg>';
    bar.appendChild(btn);

    // --- Panel (matches .menu-panel style) ---
    var panel = document.createElement('div');
    panel.id = 'color-picker-panel';
    panel.className = 'menu-panel';
    var btnIndex = Array.prototype.indexOf.call(bar.children, btn);
    var btnLeft = btnIndex * 50;
    var panelLeft = btnLeft + 25 - 110; // center 220px panel under bucket's center
    if (panelLeft < 0) panelLeft = 0;
    panel.style.cssText = 'display:none; left:' + panelLeft + 'px; width:220px; padding-top:6px; margin-top:-6px;';
    panel.innerHTML = `
      <div class="menu-panel-title">Car Colour</div>
      <div class="menu-panel-choice-row">
        <div class="menu-panel-choice-option choice-selected" id="cp-tab-flat" onclick="cpTab('flat')">Solid</div>
        <div class="menu-panel-choice-option" id="cp-tab-grad" onclick="cpTab('grad')">Gradient</div>
      </div>
      <div class="menu-panel-row" style="height:80px; flex-direction:column; gap:8px;">
        <div id="cp-flat-row" style="display:flex; align-items:center; justify-content:center; gap:12px;">
          <span style="font-family:Jura;color:hsla(0,0%,100%,0.73);font-size:13px;">Colour</span>
          <input type="color" id="cp-col1" value="#ffffff" style="width:40px;height:32px;border:none;background:none;cursor:pointer;">
        </div>
        <div id="cp-grad-row" style="display:none; align-items:center; justify-content:center; gap:8px;">
          <input type="color" id="cp-col2" value="#1a1aff" style="width:36px;height:32px;border:none;background:none;cursor:pointer;">
          <svg width="30" height="16" style="flex-shrink:0"><defs><linearGradient id="pg"><stop offset="0%" stop-color="#ffffff"/><stop id="pg2" offset="100%" stop-color="#1a1aff"/></linearGradient></defs><rect width="30" height="16" fill="url(#pg)" rx="3"/></svg>
          <input type="color" id="cp-col3" value="#ff2200" style="width:36px;height:32px;border:none;background:none;cursor:pointer;">
        </div>
      </div>
    `;
    document.getElementById('menu-bar').appendChild(panel);

    // --- Hover to open (match other icons) ---
    btn.onmouseenter = function() { panel.style.display = 'flex'; };
    btn.onmouseleave = function() { panel.style.display = 'none'; };
    panel.onmouseenter = function() { panel.style.display = 'flex'; };
    panel.onmouseleave = function() { panel.style.display = 'none'; };

    // --- Tab switch ---
    window.cpTab = function(mode) {
      document.getElementById('cp-flat-row').style.display = mode === 'flat' ? 'flex' : 'none';
      document.getElementById('cp-grad-row').style.display = mode === 'grad' ? 'flex' : 'none';
      document.getElementById('cp-tab-flat').className = 'menu-panel-choice-option' + (mode==='flat'?' choice-selected':'');
      document.getElementById('cp-tab-grad').className  = 'menu-panel-choice-option' + (mode==='grad'?' choice-selected':'');
      applyCarColor();
    };

    // --- Color inputs -> car ---
    ['cp-col1','cp-col2','cp-col3'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', applyCarColor);
    });

    // Sync gradient preview swatch
    document.getElementById('cp-col2').addEventListener('input', function() {
      document.querySelector('#pg stop').setAttribute('stop-color', this.value);
    });
    document.getElementById('cp-col3').addEventListener('input', function() {
      document.getElementById('pg2').setAttribute('stop-color', this.value);
    });

    function applyCarColor() {
      var scene = window._carScene;
      if (!scene) { console.warn('[color-picker] no scene captured yet — window._threeObjects:', window._threeObjects); return; }
      var isGrad = document.getElementById('cp-tab-grad').classList.contains('choice-selected');
      var col1 = document.getElementById('cp-col1').value;
      var col2 = document.getElementById('cp-col2').value;
      var col3 = document.getElementById('cp-col3').value;

      scene.traverse(function(obj) {
        if (!obj.isMesh || !obj.material || !obj.material.color) return;
        // ponytail: skip any material with a custom onBeforeCompile (terrain/sky/water/foliage
        // all get one; the car material doesn't). Bounding-sphere radius false-matched small
        // foliage meshes and nulling their .map killed USE_MAP, breaking their hardcoded
        // map_fragment shader replacement (undeclared 'map'/'vUv' -> shader compile error).
        if (obj.material.onBeforeCompile) return;

        if (!isGrad) {
          obj.material.map = null;
          obj.material.color.set(col1);
        } else {
          var c = document.createElement('canvas');
          c.width = 1; c.height = 256;
          var ctx = c.getContext('2d');
          var g = ctx.createLinearGradient(0,0,0,256);
          g.addColorStop(0, col2);
          g.addColorStop(1, col3);
          ctx.fillStyle = g;
          ctx.fillRect(0,0,1,256);
          // No direct THREE reference available — reuse an existing texture instance's
          // constructor from any material already in the scene, clone + repaint it.
          var TextureCtor = null;
          scene.traverse(function(o2) {
            if (TextureCtor) return;
            if (o2.isMesh && o2.material && o2.material.map) TextureCtor = o2.material.map.constructor;
          });
          if (TextureCtor) {
            var tex = new TextureCtor(c);
            tex.needsUpdate = true;
            obj.material.map = tex;
          } else {
            // Fallback: no texture constructor found anywhere — blend the two colors flat
            var r1=parseInt(col2.slice(1,3),16), g1=parseInt(col2.slice(3,5),16), b1=parseInt(col2.slice(5,7),16);
            var r2=parseInt(col3.slice(1,3),16), g2=parseInt(col3.slice(3,5),16), b2=parseInt(col3.slice(5,7),16);
            var mix = '#' + Math.round((r1+r2)/2).toString(16).padStart(2,'0') + Math.round((g1+g2)/2).toString(16).padStart(2,'0') + Math.round((b1+b2)/2).toString(16).padStart(2,'0');
            obj.material.map = null;
            obj.material.color.set(mix);
          }
          if (obj.material.map) obj.material.color.set('#ffffff');
        }
        obj.material.needsUpdate = true;
      });
    }
  }, 300);
})();
</script>
