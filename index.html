<script>
  // Auto-skip the "slow roads" intro screen by clicking the "begin" button
  // as soon as it appears in the DOM.
  (function () {
    var attempts = 0;
    var maxAttempts = 150; // ~15s at 100ms interval, generous for slow loads

    function findBeginButton() {
      // Look through clickable-ish elements for exact text "begin"
      var candidates = document.querySelectorAll('button, div, span, a');
      for (var i = 0; i < candidates.length; i++) {
        var text = candidates[i].textContent.trim().toLowerCase();
        if (text === 'begin') {
          return candidates[i];
        }
      }
      return null;
    }

    var poll = setInterval(function () {
      attempts++;
      var beginBtn = findBeginButton();

      if (beginBtn) {
        beginBtn.click();
        clearInterval(poll);
      } else if (attempts >= maxAttempts) {
        clearInterval(poll); // stop trying, avoid infinite loop
      }
    }, 100);
  })();
</script>
<script>
  // Color picker — inject after game canvas is ready
  (function () {
    function injectPicker() {
      var ui = document.createElement('div');
      ui.id = 'car-color-picker';
      ui.innerHTML = `
        <select id="cp-mode" style="margin-bottom:4px">
          <option value="flat">Solid</option>
          <option value="gradient">Gradient</option>
        </select>
        <input type="color" id="cp-col1" value="#ffffff">
        <input type="color" id="cp-col2" value="#ff0000" style="display:none">
      `;
      ui.style.cssText = 'position:fixed;bottom:18px;left:160px;z-index:9999;background:rgba(0,0,0,.5);padding:6px;border-radius:6px;display:flex;flex-direction:column;align-items:center';
      document.body.appendChild(ui);

      document.getElementById('cp-mode').addEventListener('change', function(e) {
        document.getElementById('cp-col2').style.display = e.target.value === 'gradient' ? 'inline' : 'none';
      });

      // wire color change -> Three.js scene
      ['cp-col1','cp-col2'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', applyColor);
      });
    }

    function applyColor() {
      var mode = document.getElementById('cp-mode').value;
      var col1 = document.getElementById('cp-col1').value;
      var col2 = document.getElementById('cp-col2').value;
      var canvas = document.querySelector('canvas');
      if (!canvas) return;

      // Three.js exposes renderer on canvas.__r3f or via traversal
      // ponytail: traverse scene, find car meshes by largest bounding box or name
      var scene = window.__THREE_DEVTOOLS__?.scenes?.[0];  // devtools hook (unreliable)
      if (!scene) return; // TODO: find reliable scene ref

      scene.traverse(function(obj) {
        if (obj.isMesh && obj.material && obj.material.color) {
          if (mode === 'flat') {
            obj.material.color.set(col1);
            obj.material.map = null;
          } else {
            // gradient via canvas texture
            var c = document.createElement('canvas');
            c.width = 2; c.height = 128;
            var ctx = c.getContext('2d');
            var g = ctx.createLinearGradient(0, 0, 0, 128);
            g.addColorStop(0, col1);
            g.addColorStop(1, col2);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 2, 128);
            obj.material.map = new THREE.CanvasTexture(c);
            obj.material.color.set('#ffffff');
          }
          obj.material.needsUpdate = true;
        }
      });
    }

    // wait for game to boot
    var t = setInterval(function() {
      if (document.querySelector('canvas')) {
        clearInterval(t);
        injectPicker();
      }
    }, 500);
  })();
</script>
