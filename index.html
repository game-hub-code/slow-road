<script>
(function() {
  // --- Auto-skip splash screen ---
  var skip = setInterval(function() {
    var beginBtn = document.querySelector('.splash-ready') ||
      Array.from(document.querySelectorAll('div')).find(function(d){ return d.textContent.trim() === 'begin'; });
    if (beginBtn) {
      clearInterval(skip);
      beginBtn.click();
    }
  }, 200);
  setTimeout(function(){ clearInterval(skip); }, 15000); // give up after 15s

  // --- Hide donate button/link (matches short "donate" text nodes only) ---
  var hideDonate = setInterval(function() {
    var found = false;
    document.querySelectorAll('div, a, button').forEach(function(el) {
      if (el.children.length === 0) {
        var txt = (el.textContent || '').trim().toLowerCase();
        if (txt === 'donate' || txt === 'donations keep the game running!') {
          el.style.display = 'none';
          found = true;
        }
      }
    });
    if (found) clearInterval(hideDonate);
  }, 300);
  setTimeout(function(){ clearInterval(hideDonate); }, 15000);

  // --- Hide coffee/heart donate icon in menu-bar-right ---
  var hideCoffee = setInterval(function() {
    var right = document.getElementById('menu-bar-right');
    if (!right) return;
    var found = false;
    right.querySelectorAll('.menu-item, [title]').forEach(function(el) {
      var title = (el.getAttribute('title') || '').toLowerCase();
      var svg = el.querySelector('svg');
      var svgHtml = svg ? svg.innerHTML.toLowerCase() : '';
      if (title.indexOf('donat') !== -1 || title.indexOf('coffee') !== -1 || title.indexOf('support') !== -1 ||
          svgHtml.indexOf('heart') !== -1) {
        el.style.display = 'none';
        found = true;
      }
    });
    if (found) clearInterval(hideCoffee);
  }, 300);
  setTimeout(function(){ clearInterval(hideCoffee); }, 15000);

  // Wait for game UI to mount
  var t = setInterval(function() {
    var bar = document.getElementById('menu-bar-left');
    if (!bar) return;
    clearInterval(t);

    // --- Bucket icon button (matches .menu-item style) ---
    var btn = document.createElement('div');
    btn.id = 'color-picker-btn';
    btn.className = 'menu-item';
    btn.title = 'Car colour';
    btn.innerHTML = '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M4 8h16" stroke-width="2"/></svg>';
    bar.appendChild(btn);

    // --- Panel (matches .menu-panel style) ---
    var panel = document.createElement('div');
    panel.id = 'color-picker-panel';
    panel.className = 'menu-panel';
    var btnIndex = Array.prototype.indexOf.call(bar.children, btn);
    var btnLeft = btnIndex * 50;
    var panelLeft = btnLeft + 25 - 110; // center 220px panel under bucket's center
    if (panelLeft < 0) panelLeft = 0;
    panel.style.cssText = 'display:none; left:' + panelLeft + 'px; width:220px; padding-top:6px; margin-top:-6px;';
    panel.innerHTML = `
      <style>
        /* Bug fix: on first paint after page load, Chromium briefly renders the native
           input[type=color] swatch decoration (shows as a small "?" glyph) before our
           inline border/background overrides are applied on top of it — a one-frame FOUC
           that only happens on cold load, matching the reported symptom. Forcing
           -webkit-appearance:none and rebuilding the swatch box ourselves removes the
           native decoration entirely instead of racing it. */
        #cp-col1, #cp-col2, #cp-col3 {
          -webkit-appearance: none;
          appearance: none;
          padding: 0;
        }
        #cp-col1::-webkit-color-swatch-wrapper,
        #cp-col2::-webkit-color-swatch-wrapper,
        #cp-col3::-webkit-color-swatch-wrapper {
          padding: 0;
          border: none;
        }
        #cp-col1::-webkit-color-swatch,
        #cp-col2::-webkit-color-swatch,
        #cp-col3::-webkit-color-swatch {
          border: none;
          border-radius: 4px;
        }
      </style>
      <div class="menu-panel-title">Car Colour</div>
      <div class="menu-panel-choice-row">
        <div class="menu-panel-choice-option choice-selected" id="cp-tab-flat" onclick="cpTab('flat')">Solid</div>
        <div class="menu-panel-choice-option" id="cp-tab-grad" onclick="cpTab('grad')">Gradient</div>
      </div>
      <div class="menu-panel-row" style="height:80px; flex-direction:column; gap:8px;">
        <div id="cp-flat-row" style="display:flex; align-items:center; justify-content:center; gap:12px;">
          <span style="font-family:Jura;color:hsla(0,0%,100%,0.73);font-size:13px;">Colour</span>
          <input type="color" id="cp-col1" value="#ffffff" style="width:40px;height:32px;border:none;background:none;cursor:pointer;">
        </div>
        <div id="cp-grad-row" style="display:none; align-items:center; justify-content:center; gap:8px;">
          <input type="color" id="cp-col2" value="#1a1aff" style="width:36px;height:32px;border:none;background:none;cursor:pointer;">
          <svg width="30" height="16" style="flex-shrink:0"><defs><linearGradient id="pg"><stop offset="0%" stop-color="#1a1aff"/><stop id="pg2" offset="100%" stop-color="#ff2200"/></linearGradient></defs><rect width="30" height="16" fill="url(#pg)" rx="3"/></svg>
          <input type="color" id="cp-col3" value="#ff2200" style="width:36px;height:32px;border:none;background:none;cursor:pointer;">
        </div>
      </div>
    `;
    document.getElementById('menu-bar').appendChild(panel);

    // --- Hover to open (match other icons) ---
    btn.onmouseenter = function() { panel.style.display = 'flex'; };
    btn.onmouseleave = function() { panel.style.display = 'none'; };
    panel.onmouseenter = function() { panel.style.display = 'flex'; };
    panel.onmouseleave = function() { panel.style.display = 'none'; };

    // --- Tab switch ---
    window.cpTab = function(mode) {
      document.getElementById('cp-flat-row').style.display = mode === 'flat' ? 'flex' : 'none';
      document.getElementById('cp-grad-row').style.display = mode === 'grad' ? 'flex' : 'none';
      document.getElementById('cp-tab-flat').className = 'menu-panel-choice-option' + (mode==='flat'?' choice-selected':'');
      document.getElementById('cp-tab-grad').className  = 'menu-panel-choice-option' + (mode==='grad'?' choice-selected':'');
      applyCarColor();
    };

    // --- Color inputs -> car ---
    ['cp-col1','cp-col2','cp-col3'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', applyCarColor);
    });

    // Sync gradient preview swatch
    document.getElementById('cp-col2').addEventListener('input', function() {
      document.querySelector('#pg stop').setAttribute('stop-color', this.value);
    });
    document.getElementById('cp-col3').addEventListener('input', function() {
      document.getElementById('pg2').setAttribute('stop-color', this.value);
    });

    function applyCarColor() {
      var scene = window._carScene;
      if (!scene) { console.warn('[color-picker] no scene captured yet — window._threeObjects:', window._threeObjects); return; }
      var isGrad = document.getElementById('cp-tab-grad').classList.contains('choice-selected');
      var col1 = document.getElementById('cp-col1').value;
      var col2 = document.getElementById('cp-col2').value;
      var col3 = document.getElementById('cp-col3').value;

      // Rewritten to fix two things at once:
      // 1) "gradient not smooth" — the old code baked a 1x256 (or texture-image-sized)
      //    canvas gradient and mapped it via each mesh's OWN uv layout. That only looks
      //    right if a mesh has a single continuous top-to-bottom uv strip; the bus/mono
      //    bodies (and possibly others) don't, so the "gradient" came out as flat/banded
      //    colour. A GPU vertex shader instead reads each vertex's actual local Y
      //    position — always continuous and correct regardless of how the mesh was
      //    UV-unwrapped — and blends per-pixel in the fragment shader, which is smooth
      //    by construction.
      // 2) "specific to one vehicle" — the old code had a special CPU pixel-loop path
      //    (recolorBodyTexture) just for the player car's baked livery texture, plus a
      //    separate canvas-texture path for everything else. Replaced with ONE function
      //    used for every matched mesh on every vehicle: if the material already has a
      //    baked texture (only the player car does, currently), the shader masks by
      //    that texture's own brightness so windows/trim stay untouched; otherwise it
      //    just paints the whole mesh. Same code path, no per-vehicle special-casing.
      function applyVehiclePaint(obj, isGradient, flatColor, topColor, bottomColor) {
        var mat = obj.material;
        var u = mat.userData._cpUniforms;
        if (!u) {
          var geo = obj.geometry;
          if (!geo.boundingBox) geo.computeBoundingBox();
          var minY = geo.boundingBox.min.y, maxY = geo.boundingBox.max.y;
          var ColorCtor = mat.color.constructor;
          u = {
            cpMinY: { value: minY },
            cpMaxY: { value: Math.max(maxY, minY + 0.0001) },
            cpFlat: { value: new ColorCtor(1, 1, 1) },
            cpTop: { value: new ColorCtor(1, 1, 1) },
            cpBottom: { value: new ColorCtor(1, 1, 1) },
            cpIsGrad: { value: 0 },
            // Only mask by brightness when this material has a baked livery texture
            // (the player car's body). Untextured traffic-vehicle bodies (bus, mono)
            // have nothing to mask against, so they're painted in full.
            cpMaskByLuma: { value: mat.map ? 1 : 0 }
          };
          mat.onBeforeCompile = function(shader) {
            Object.assign(shader.uniforms, u);
            shader.vertexShader = shader.vertexShader
              .replace('#include <common>',
                '#include <common>\nvarying float cpVY;\nuniform float cpMinY, cpMaxY;')
              .replace('#include <begin_vertex>',
                '#include <begin_vertex>\ncpVY = clamp((position.y - cpMinY) / (cpMaxY - cpMinY), 0.0, 1.0);');
            shader.fragmentShader = shader.fragmentShader
              .replace('#include <common>',
                '#include <common>\nvarying float cpVY;\nuniform vec3 cpFlat, cpTop, cpBottom;\nuniform float cpIsGrad, cpMaskByLuma;')
              .replace('#include <color_fragment>',
                '#include <color_fragment>\n' +
                'float cpLuma = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));\n' +
                'float cpIsPaint = mix(1.0, step(0.745, cpLuma), cpMaskByLuma);\n' +
                'vec3 cpPaintColor = mix(cpFlat, mix(cpBottom, cpTop, cpVY), cpIsGrad);\n' +
                'diffuseColor.rgb = mix(diffuseColor.rgb, cpPaintColor, cpIsPaint);');
          };
          mat.userData._cpUniforms = u;
          mat.needsUpdate = true; // compile the custom shader once; later calls just update uniforms below
        }
        u.cpFlat.value.set(flatColor);
        u.cpTop.value.set(topColor);
        u.cpBottom.value.set(bottomColor);
        u.cpIsGrad.value = isGradient ? 1 : 0;
      }

      scene.traverse(function(obj) {
        if (!obj.isMesh || !obj.material || !obj.material.color) return;
        try {
        // Verified via a live console.table dump of the actual scene graph:
        // every car part (body, lights, shadow, wheels) has a real .name starting
        // with 'z_' or '(f|b)wheel_'. Every terrain/road/foliage/sky mesh is
        // '(unnamed)'. Roadside markers ('vergemarker_...') are named but a distinct
        // prefix, so they're excluded too.
        // Traffic vehicles use their own .obj files with different naming — the bus body
        // is 'bus-02_body_...' and the motorbike body is 'm2_body_...' (verified against
        // bus-02.obj / mono_2.obj). Add their body-mesh prefixes explicitly (not their
        // windows/lights/shadow parts, same restraint as the player car).
        var nm = obj.name || '';
        if (!(nm.indexOf('z_') === 0 || nm.indexOf('bwheel_') === 0 || nm.indexOf('fwheel_') === 0
            || nm.indexOf('bus-02_body') === 0 || nm.indexOf('m2_body') === 0)) return;

        applyVehiclePaint(obj, isGrad, col1, col2, col3);
        } catch (err) {
          console.warn('[color-picker] skipped mesh due to error', err);
        }
      });
    }
  }, 300);
})();
</script>
<script>
(function() {
  // --- Hide the last icon (splash-toggle) in the bottom-right menu bar ---
  var hideLastRightIcon = setInterval(function() {
    var right = document.getElementById('menu-bar-right');
    if (!right) return;
    var items = right.querySelectorAll('.menu-item');
    if (items.length === 0) return;
    items[items.length - 1].style.display = 'none';
    clearInterval(hideLastRightIcon);
  }, 300);
  setTimeout(function(){ clearInterval(hideLastRightIcon); }, 15000);
})();
</script>
<script>
(function() {
  // --- Boost indicator: lightning bolt next to the speed readout, lit while boosting ---
  var style = document.createElement('style');
  style.textContent = [
    '#ui-boost-icon{position:absolute;right:100%;top:0;height:100%;',
    'display:flex;align-items:center;margin-right:.5vh;opacity:0;transition:opacity .15s ease-out;}',
    '#ui-boost-icon svg{width:3vh;height:3vh;stroke:#fff;fill:#fff;}',
    '#ui-boost-icon.boost-active{opacity:1;filter:drop-shadow(0 0 4px rgba(255,255,255,.8));}'
  ].join('');
  document.head.appendChild(style);

  var setupBoostIcon = setInterval(function() {
    var speedEl = document.getElementById('ui-speed');
    if (!speedEl || document.getElementById('ui-boost-icon')) return;
    clearInterval(setupBoostIcon);

    var icon = document.createElement('div');
    icon.id = 'ui-boost-icon';
    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
    speedEl.insertBefore(icon, speedEl.firstChild);

    (function poll() {
      var boosting = !!(window._carState && window._carState.hasBoost);
      icon.classList.toggle('boost-active', boosting);
      requestAnimationFrame(poll);
    })();
  }, 300);
  setTimeout(function(){ clearInterval(setupBoostIcon); }, 15000);
})();
</script>
<script>
  // Auto-click when ready, then permanently suppress the container
  var _check = setInterval(function() {
    var loader = document.getElementById('splash-loader');
    if (loader && loader.classList.contains('splash-ready')) {
      loader.click();
      clearInterval(_check);

      // Permanently hide — covers re-show from Esc or icon click
      var style = document.createElement('style');
      style.textContent = '#splash-container { display: none !important; }';
      document.head.appendChild(style);

      // Also block Esc from re-opening it
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') e.stopImmediatePropagation();
      }, true);
    }
  }, 50);
</script>
